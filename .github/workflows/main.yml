jobs:
  unix:
    name: '${{matrix.node}} on ${{matrix.os}}'
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node}}
      - run: npm install
      - run: npm test
      - uses: codecov/codecov-action@v7
    strategy:
      matrix:
        os:
          - ubuntu-latest
        node:
          - lts/jod
          - node
  # Just run quick tests on windows.
  windows:
    name: '${{matrix.node}} on ${{matrix.os}}'
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{matrix.node}}
      - run: npm install
      - run: npm run test-api
    strategy:
      matrix:
        os:
          - windows-latest
        node:
          - lts/jod
          - node
name: main
on:
  - pull_request
  - push
